services:
  postgres:
    image: postgres:16-alpine
    container_name: jiuju-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jiuju}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-jiuju}
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jiuju} -d ${POSTGRES_DB:-jiuju}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jiuju

volumes:
  postgres-data:

networks:
  jiuju:
    driver: bridge
